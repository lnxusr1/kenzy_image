site_name: KENZY_IMAGE Docs
site_url: https://kenzy.dev/
repo_url: https://github.com/lnxusr1/kenzy-image/

theme: 
    name: readthedocs
    highlightjs: true
    prev_next_buttons_location: none
    titles_only: true
    collapse_navigation: false
    logo: https://kenzy.dev/wp-content/uploads/2023/06/kenzy_image_logo_text_light.png

nav:
    - Overview: 'index.md'
    - Detector: 'detector.md'
    - References: 'references.md'
    - Links:
      - '@ Code': 'https://kenzy.dev/code'
      - '@ Community': 'https://kenzy.dev/discussion/kenzy-image'
      - '@ Bugs & Issues': 'https://kenzy.dev/issues/kenzy-image'
      - '@ kenzy.ai': 'https://kenzy.dev'

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
          - import sys
          - sys.path.append("src")
